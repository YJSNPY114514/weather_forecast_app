<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>都道府県取得デモ</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>緯度経度から都道府県名を取得</h1>
      <div style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;">
        <label>緯度 <input id="lat" type="number" step="0.000001" value="35.6762" /></label>
        <label>経度 <input id="lon" type="number" step="0.000001" value="139.6503" /></label>
        <button id="run">取得</button>
      </div>
    </header>

    <section style="margin-top:12px;">
      <div id="pref" class="region" style="font-weight:600;"></div>
      <div id="detail" class="muted"></div>
      <div id="error" style="color:#d33; margin-top:6px;"></div>
    </section>
  </div>

  <!-- GSI 名前空間を事前定義（muni.js が使用） -->
  <script>window.GSI = window.GSI || {};</script>
  <!-- 読み込み順：muni.js → test.js -->
  <script src="static/muni.js"></script>
  <script src="static/test.js"></script>
  <script>
    (function(){
      function show(pref){
        const prefEl = document.getElementById('pref');
        const detailEl = document.getElementById('detail');
        const errEl = document.getElementById('error');
        errEl.textContent = '';
        if (pref) {
          prefEl.textContent = `${pref.name} (code: ${pref.code})`;
          detailEl.textContent = '緯度・経度から国土地理院の逆ジオコーディング結果を参照して表示しています。';
        } else {
          prefEl.textContent = '';
          detailEl.textContent = '';
          errEl.textContent = '都道府県を取得できませんでした。位置を変えて再試行してください。';
        }
      }

      async function run(){
        const lat = Number(document.getElementById('lat').value);
        const lon = Number(document.getElementById('lon').value);
        const svc = window.useGeolocationService && window.useGeolocationService();
        if (!svc) {
          document.getElementById('error').textContent = 'スクリプトの読み込み順を確認してください (muni.js → test.js)。';
          return;
        }
        if (!Number.isFinite(lat) || !Number.isFinite(lon)) {
          document.getElementById('error').textContent = '緯度・経度には数値を入力してください。';
          return;
        }
        try {
          const pref = await svc.getPrefectureFromLatLon({ lat, lon });
          show(pref);
        } catch (e) {
          console.error(e);
          document.getElementById('error').textContent = '取得中にエラーが発生しました。';
        }
      }

      document.getElementById('run').addEventListener('click', run);
      if (document.readyState === 'loading') {
        window.addEventListener('DOMContentLoaded', run);
      } else {
        run();
      }
    })();
  </script>
</body>
<!-- 備考: GSIデータ (static/muni.js) と test.js を利用しています -->
</html>
