<!doctype html>
<html lang="ja">

  <title>天気予報</title>
  <link rel="stylesheet" href="static/style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>天気予報（今週）</h1>
      <label>

          <option value="35.6762,139.6503">東京</option>
          <option value="34.6937,135.5023">大阪</option>
